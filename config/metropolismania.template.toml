# PS2Recomp configuration for Metropolismania (USA), SLUS-20377, disc VER 1.02.
#
# tools/pipeline.py renders this file into work/metropolismania.toml:
#   @ELF@ -> original/SLUS_203.77
#   @MAP@ -> config/funcmap.csv (Ghidra function map)
#   @OUT@ -> generated/
# Stubs that Ghidra's ExportPS2Functions.java classifies (work/ghidra_export.toml) are merged
# into [general].stubs and [general].untracked_stubs.
#
# Every address here is only valid for this exact build (ELF CRC32 4FA3F727).

[general]
input = "@ELF@"
output = "@OUT@"
ghidra_output = "@MAP@"
single_file_output = false
low_memory_mode = false
output_worker_threads = 0
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# handler@0xADDR bindings to runtime handlers (see ps2xRuntime/include/ps2_call_list.h).
# Triage helpers: ret0@0xADDR, ret1@0xADDR, reta0@0xADDR. Keep these few and documented.
# ExitThread@0x001000C0 is crt0's thread end (a thread whose entry function returns lands there) and ExitThread@0x0010D980 is the SDK's
# _Exit (the Exit system call, which the runtime handles as ExitThread). A thread exit has to unwind from guest code, so the readable
# port cannot write them as C++ (plan P7); the runtime's handler does it, like ExitDeleteThread.
stubs = ["ExitThread@0x001000C0", "ExitThread@0x0010D980"]

# Extra function starts the analysis misses (for example functions only reached through tables).
entry_points = []

skip = []

[patches]
# Raw instruction replacements: { address = "0x...", value = "0x..." }
instructions = []

[pipeline]
# Read by tools/pipeline.py only; removed from the rendered config.
# SDK functions whose runtime handler is still TODO are left as recompiled original code.
# List a handler name here to bind it anyway.
keep_todo_stubs = []
# fnmatch patterns of SDK functions to keep as the game's own recompiled code even when the
# runtime has a handler for them.
# sceVu0*: the runtime's HLE matrix library broke the city's camera (docs/STATUS.md, item 9).
# sceSdRemote*: the runtime's HLE only fakes libsdr replies; the game loads the real SDRDRV on the
# IOP emulator, so the game's own libsdr RPCs reach libsd and the SPU2 (movie sound needs this).
# sceGifPk*: the runtime's sceGifPkAddGsAD and sceGifPkCloseGifTag keep the open DMA tag's quadword count up to date as they go,
# but the game's own libpkt adds that count once more when the tag is closed, so every tag that holds an A+D block came out with
# a doubled count and the DMA chain stopped after the first one (the movie's picture upload, docs/PLATFORM_FINDINGS.md).
force_recompile = ["sceVu0*", "sceSdRemote*", "sceGifPk*"]
